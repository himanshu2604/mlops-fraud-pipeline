apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fraud-detection-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/himanshu2604/mlops-fraud-pipeline.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops-fraud
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
  # Without this, selfHeal fights the HorizontalPodAutoscaler: HPA scales
  # replicas up, ArgoCD sees that as drift from the git-declared replicas
  # and scales it back down on the next sync, undoing the autoscaler.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
