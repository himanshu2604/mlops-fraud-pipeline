name: Retrain

on:
  repository_dispatch:
    types: [model-drift-detected]
  workflow_dispatch: {}  # manual trigger, useful for testing this workflow directly

permissions:
  contents: write  # needed to commit the updated ConfigMap + champion_metrics.json

jobs:
  retrain-and-promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # champion_metrics.json needs to be read from and committed back to
          # the actual default branch, not a detached HEAD from the dispatch event
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      # Stand-in for pulling real fresh data - same as drift-check.yml
      - name: Generate data
        run: python src/generate_data.py

      - name: Train
        run: python src/train.py

      # Same absolute floor as the main CI pipeline - a retrain that
      # produces a genuinely bad model should never reach promotion,
      # regardless of what promote.py's champion comparison says.
      - name: Enforce minimum ROC AUC
        run: |
          python -c "
          import json, sys
          metrics = json.load(open('models/metrics.json'))
          auc = metrics['roc_auc']
          print(f'roc_auc={auc}')
          sys.exit(0 if auc >= 0.85 else 1)
          "

      - name: Promote if better than champion
        id: promote
        env:
          MODEL_S3_BUCKET: ${{ secrets.MODEL_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: python src/promote.py

      - name: Commit and push if promoted
        if: steps.promote.outputs.promoted == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/configmap.yaml models/champion_metrics.json
          git commit -m "chore: promote model to ${{ steps.promote.outputs.model_uri }} [skip ci]"
          git push origin main
