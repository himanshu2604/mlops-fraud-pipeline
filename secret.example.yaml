# DO NOT fill in real values here or commit this file with credentials.
# This is documentation of the shape only. Create the real secret
# imperatively instead, so credentials never touch git history:
#
#   kubectl create secret generic fraud-model-aws-creds \
#     --namespace=mlops-fraud \
#     --from-literal=AWS_ACCESS_KEY_ID=your-key-id \
#     --from-literal=AWS_SECRET_ACCESS_KEY=your-secret-key \
#     --from-literal=AWS_DEFAULT_REGION=ap-south-1
#
# Skip this entirely if you're testing with a local or http(s) MODEL_URI -
# the deployment references this secret with optional: true, so pods start
# fine without it.
apiVersion: v1
kind: Secret
metadata:
  name: fraud-model-aws-creds
  namespace: mlops-fraud
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  AWS_DEFAULT_REGION: "ap-south-1"
