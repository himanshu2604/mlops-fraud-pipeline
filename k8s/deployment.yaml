apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detection-service
  namespace: mlops-fraud
  labels:
    app: fraud-detection-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: fraud-detection-service
  template:
    metadata:
      labels:
        app: fraud-detection-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: fraud-detection-service
          # ArgoCD tracks this tag - CI updates it on each successful build.
          image: ghcr.io/OWNER/mlops-fraud-pipeline:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: fraud-model-config
          env:
            # Only needed if MODEL_URI uses the s3:// scheme. optional: true
            # means the pod still starts fine if you haven't created this
            # secret yet (e.g. while testing with a local/http MODEL_URI).
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: fraud-model-aws-creds
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fraud-model-aws-creds
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: fraud-model-aws-creds
                  key: AWS_DEFAULT_REGION
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
